<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with the bot on WhatsApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #075e54 0%, #128c7e 100%);
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 420px;
            width: 100%;
        }
        h1 { color: #075e54; margin-bottom: 0.25rem; font-size: 1.5rem; }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            background: #25d36622;
            color: #128c7e;
            padding: 0.25rem 0.6rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
        }
        p { color: #555; margin-bottom: 1.5rem; white-space: pre-line; text-align: left; }
        .qr-code img { width: 240px; height: 240px; border-radius: 0.5rem; }
        .phone-number { font-size: 1.2rem; font-weight: 600; color: #128c7e; margin-top: 1rem; }
        .cta {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: #25d366;
            color: white;
            text-decoration: none;
            border-radius: 2rem;
            font-weight: 600;
        }
        .cta:hover { background: #128c7e; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📄 Document Assistant</h1>
        <span class="badge">{{ provider }}</span>
        <p>{{ instructions }}</p>
        <div class="qr-code">
            <img src="data:image/png;base64,{{ qr_base64 }}" alt="WhatsApp QR Code">
        </div>
        <div class="phone-number">{{ phone_display }}</div>
        <a href="{{ wa_url }}" class="cta">💬 Open WhatsApp</a>
    </div>
</body>
</html>
